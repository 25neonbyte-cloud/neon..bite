<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>NeonBite | Soluções Digitais</title>
  <meta name="description" content="Agregador oficial da NeonBite para contato, soluções digitais, projetos e conteúdo.">
  <meta name="theme-color" content="#03070b">
  <meta property="og:title" content="NeonBite | Soluções Digitais">
  <meta property="og:description" content="Agregador oficial da NeonBite para contato, soluções digitais, projetos e conteúdo.">
  <meta property="og:type" content="website">
  <link rel="icon" href="../assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <canvas class="nb-data-field" data-data-field aria-hidden="true"></canvas>
  <div class="nb-atmosphere" aria-hidden="true"></div>

  <div class="nb-shell" data-shell>
    <header class="nb-header">
      <a class="nb-wordmark" href="../" aria-label="NeonBite — ir para o site principal">
        <span>NEON</span><span>BITE</span>
      </a>

      <button class="nb-sound" type="button" data-sound aria-pressed="false" aria-label="Ativar som">
        <span class="nb-eq" data-eq aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i>
        </span>
        <span class="nb-sound-copy">SOUND <strong data-sound-state>OFF</strong></span>
        <span class="nb-switch" aria-hidden="true"><span></span></span>
      </button>
    </header>

    <main class="nb-main">
      <section class="nb-hero" aria-labelledby="nb-title">
        <div class="nb-logo-stage" aria-hidden="true">
          <span class="nb-logo-orbit"></span>
          <img class="nb-logo" src="../assets/logo.png" alt="" decoding="async">
        </div>

        <h1 class="nb-title" id="nb-title"><span>NEON</span><span>BITE</span></h1>
        <p class="nb-positioning">Soluções digitais com eficiência,<br class="nb-wide-break"> personalidade e tecnologia.</p>
        <span class="nb-hero-rule" aria-hidden="true"></span>

        <nav class="nb-shortcuts" aria-label="Atalhos NeonBite">
          <a class="nb-shortcut nb-shortcut--instagram" data-reactive data-ripple href="https://www.instagram.com/neonbite_/" target="_blank" rel="noopener noreferrer" aria-label="Abrir Instagram da NeonBite">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.6" cy="6.6" r="1" class="nb-fill"/></svg>
          </a>
          <a class="nb-shortcut nb-shortcut--whatsapp" data-reactive data-ripple href="https://wa.me/556293661942" target="_blank" rel="noopener noreferrer" aria-label="Abrir WhatsApp da NeonBite">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 11.8a8.3 8.3 0 0 1-12.2 7.3L4 20.2l1.1-4A8.3 8.3 0 1 1 20.4 11.8Z"/><path d="M9 8.1c.3-.6.7-.6 1-.6h.5c.2 0 .4.1.5.4l.9 2.1c.1.3.1.5-.1.7l-.7.9c-.2.2-.1.4 0 .6.5.9 1.2 1.7 2.1 2.2.3.2.5.2.7 0l.9-1.1c.2-.2.4-.3.7-.2l2.1 1c.3.1.4.3.4.5 0 .3-.1 1.4-.7 2-.5.6-1.4 1-2.5.8-1.5-.3-3.3-1.1-5.1-2.8-1.5-1.4-2.6-3.2-2.9-4.6-.3-1.2.2-1.9.6-2.3.4-.4.9-.6 1.6-.6Z"/></svg>
          </a>
          <a class="nb-shortcut nb-shortcut--home" data-reactive data-ripple href="../" aria-label="Abrir site principal da NeonBite">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.8 12 3.7l8.5 7.1v9a.7.7 0 0 1-.7.7h-5.1v-6h-5.4v6H4.2a.7.7 0 0 1-.7-.7v-9Z"/></svg>
          </a>
        </nav>
      </section>

      <section class="nb-links" aria-label="Links principais">
        <a class="nb-card nb-card--whatsapp" data-reactive data-ripple href="https://wa.me/556293661942" target="_blank" rel="noopener noreferrer">
          <span class="nb-card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M20.4 11.8a8.3 8.3 0 0 1-12.2 7.3L4 20.2l1.1-4A8.3 8.3 0 1 1 20.4 11.8Z"/><path d="M9 8.1c.3-.6.7-.6 1-.6h.5c.2 0 .4.1.5.4l.9 2.1c.1.3.1.5-.1.7l-.7.9c-.2.2-.1.4 0 .6.5.9 1.2 1.7 2.1 2.2.3.2.5.2.7 0l.9-1.1c.2-.2.4-.3.7-.2l2.1 1c.3.1.4.3.4.5 0 .3-.1 1.4-.7 2-.5.6-1.4 1-2.5.8-1.5-.3-3.3-1.1-5.1-2.8-1.5-1.4-2.6-3.2-2.9-4.6-.3-1.2.2-1.9.6-2.3.4-.4.9-.6 1.6-.6Z"/></svg>
          </span>
          <span class="nb-card-copy">
            <strong>WhatsApp Neon</strong>
            <span>Fale com a NeonBite para orçamento ou dúvidas.</span>
          </span>
          <span class="nb-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></span>
        </a>

        <div class="nb-card-grid">
          <a class="nb-card nb-card--solutions" data-reactive data-ripple href="../">
            <span class="nb-card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.8 12h16.4M12 3.5c2.2 2.2 3.4 5.1 3.4 8.5S14.2 18.3 12 20.5M12 3.5C9.8 5.7 8.6 8.6 8.6 12s1.2 6.3 3.4 8.5"/></svg>
            </span>
            <span class="nb-card-copy">
              <strong>Soluções NeonBite</strong>
              <span>Conheça nossos serviços e projetos.</span>
            </span>
            <span class="nb-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></span>
          </a>

          <a class="nb-card nb-card--instagram" data-reactive data-ripple href="https://www.instagram.com/neonbite_/" target="_blank" rel="noopener noreferrer">
            <span class="nb-card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.6" cy="6.6" r="1" class="nb-fill"/></svg>
            </span>
            <span class="nb-card-copy">
              <strong>Instagram</strong>
              <span>Conteúdo, trabalhos e bastidores.</span>
            </span>
            <span class="nb-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></span>
          </a>
        </div>
      </section>
    </main>

    <footer class="nb-footer">
      <div class="nb-footer-line" aria-hidden="true"></div>
      <p>IDEIAS <span>·</span> CONECTAM <span>·</span> RESULTADOS</p>
      <div class="nb-footer-brand"><i></i><strong>NEONBITE</strong><i></i></div>
      <small>EST. 2024</small>
    </footer>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
